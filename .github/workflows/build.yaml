name: build

on:
  push:
    branches:
    tags:
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: set up go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
        id: go

      - name: checkout
        uses: actions/checkout@v5

      - name: build and test
        run: |
          go test -v -timeout=100s

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
